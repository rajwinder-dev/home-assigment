services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - prisma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - prisma-network

  api:
    build:
      context: .
      target: api
    image: rajwindersxxx/employee-management:api
    env_file:
      - .env
    environment:
      - PORT=3000
      - REDIS_PORT=6379
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/postgres
    command: sh -c "pnpm run setup:db && pnpm run start"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(\"http\").get(\"http://localhost:3000/health\", (r) => process.exit(r.statusCode === 200 ? 0 : 1))"',
        ]
      retries: 5
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - prisma-network

  email-worker:
    build:
      target: email-worker
    image: rajwindersxxx/ticket-management:email-worker
    env_file:
      - .env
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - prisma-network # Essential so it can see the redis container

  web:
    build:
      context: .
      target: web
    image: rajwindersxxx/employee-management:web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - prisma-network

networks:
  prisma-network:

volumes:
  postgres_data:
  redis-data:
